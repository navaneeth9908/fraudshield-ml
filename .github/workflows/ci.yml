name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test with branch coverage
        run: uv run pytest --cov=fraudshield --cov-branch -q

      - name: Build package
        run: uv build

      - name: Build container
        run: docker build -t fraudshield-ml:ci .

      - name: Smoke-test container package
        run: >-
          docker run --rm --entrypoint python fraudshield-ml:ci
          -c "from fraudshield.api import app; assert app.title == 'FraudShield ML Inference API'"
