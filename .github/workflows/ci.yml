name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test with branch coverage
        run: uv run pytest --cov=fraudshield --cov-branch -q

      - name: Build package
        run: uv build

      - name: Smoke-test dashboard entry point
        run: >-
          uv run python -c "from fastapi.testclient import TestClient;
          from fraudshield.api import create_app;
          response = TestClient(create_app()).get('/dashboard');
          assert response.status_code == 200;
          assert 'FraudShield analyst console' in response.text"

      - name: Build container
        run: docker build -t fraudshield-ml:ci .

      - name: Smoke-test container package
        run: >-
          docker run --rm --entrypoint python fraudshield-ml:ci
          -c "from fraudshield.api import app;
          from fraudshield.dashboard import render_dashboard;
          assert app.title == 'FraudShield ML Inference API';
          assert 'FraudShield analyst console' in render_dashboard()"
